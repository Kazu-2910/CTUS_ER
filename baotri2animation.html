<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 Page Not Found</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Arvo&family=Poppins:wght@500&display=swap" rel="stylesheet">
<style>
  /* ===== style.css ===== */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #fafafa;
    color: #333;
    font-family: 'Arvo', Georgia, serif;
  }
  .page_404 { width: 100%; padding: 24px 16px; text-align: center; }
  .contant_box_404 { margin-top: 50px; max-width: 560px; margin-inline: auto; }
  #stage { width: 100%; height: auto; display: block; overflow: visible; }
  .contant_box_404 h3 { font-size: 26px; font-weight: 400; margin-top: 4px; }
  .contant_box_404 p  { font-size: 13px; margin-top: 8px; }
  .link_404 {
    color: #fff !important;
    padding: 10px 20px;
    background: #39ac31;
    margin: 20px 0;
    display: inline-block;
    text-decoration: none;
  }
  .link_404:hover { background: #2f9328; }
</style>
</head>
<body>

<section class="page_404">
  <div class="contant_box_404">

    <svg id="stage" viewBox="0 0 520 285" role="img" aria-label="404 - a caveman gets zapped by an electric cable">
      <defs>
        <pattern id="spots" width="13" height="11" patternUnits="userSpaceOnUse">
          <ellipse cx="3" cy="3" rx="2.1" ry="1.3" fill="#c9690f"/>
          <ellipse cx="9.5" cy="8.5" rx="2.1" ry="1.3" fill="#c9690f"/>
        </pattern>
        <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
          <feMorphology in="SourceAlpha" operator="dilate" radius="2.5" result="d"/>
          <feGaussianBlur in="d" stdDeviation="5" result="b"/>
          <feFlood id="glowColor" flood-color="#ffd83a" flood-opacity="1"/>
          <feComposite in2="b" operator="in" result="c"/>
          <feMerge><feMergeNode in="c"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="cordGlow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <radialGradient id="flashG">
          <stop offset="0" stop-color="#fff" stop-opacity="1"/>
          <stop offset=".45" stop-color="#fff3a0" stop-opacity=".7"/>
          <stop offset="1" stop-color="#ffe45c" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <!-- ===== scene ===== -->
      <g id="scene" fill="#ececec">
        <!-- stacked stones (left) -->
        <path d="M128 262 C128 240 137 226 150 226 C163 226 172 240 172 262Z"/>
        <rect x="123" y="207" width="54" height="17" rx="8.5"/>
        <rect x="144" y="186" width="14" height="22" rx="7"/>
        <ellipse cx="150" cy="180" rx="8" ry="10"/>
        <!-- tall rock (right) -->
        <path d="M383 262 V168 C383 128 400 110 419 110 C438 110 456 128 456 168 V262Z" fill="#ededed"/>
        <!-- bushes -->
        <g fill="#3fb02f">
          <circle cx="122" cy="252" r="10"/><circle cx="133" cy="255" r="7.5"/><circle cx="112" cy="257" r="5.5"/>
          <ellipse cx="203" cy="260" rx="9" ry="3.5"/>
          <circle cx="358" cy="257" r="6.5"/><circle cx="367" cy="259" r="4.5"/>
          <ellipse cx="466" cy="260" rx="8" ry="3"/>
        </g>
      </g>

      <text x="260" y="66" text-anchor="middle" font-family="Poppins, system-ui, sans-serif"
            font-weight="500" font-size="60" fill="#333" letter-spacing="1">404</text>

      <ellipse id="shadow" cx="260" cy="262" rx="24" ry="3" fill="#000" opacity=".1"/>

      <g id="actors">
        <!-- ===== character ===== -->
        <g id="char">
          <g id="root">

            <!-- legs -->
            <g id="legL">
              <rect class="skin" x="-5.5" y="-3" width="11" height="29" rx="5.5"/>
              <line class="bone" x1="0" y1="0" x2="0" y2="24"/>
              <g id="shinL">
                <rect class="skin" x="-4.8" y="-3" width="9.6" height="27" rx="4.8"/>
                <ellipse class="skin" cx="0" cy="25.5" rx="7" ry="3.6"/>
                <line class="bone" x1="0" y1="0" x2="0" y2="24"/>
              </g>
            </g>
            <g id="legR">
              <rect class="skin" x="-5.5" y="-3" width="11" height="29" rx="5.5"/>
              <line class="bone" x1="0" y1="0" x2="0" y2="24"/>
              <g id="shinR">
                <rect class="skin" x="-4.8" y="-3" width="9.6" height="27" rx="4.8"/>
                <ellipse class="skin" cx="0" cy="25.5" rx="7" ry="3.6"/>
                <line class="bone" x1="0" y1="0" x2="0" y2="24"/>
              </g>
            </g>

            <!-- torso -->
            <g id="torso">
              <rect class="skin" x="-16" y="-54" width="32" height="54" rx="8"/>
              <g id="ribs" class="boneset">
                <line x1="0" y1="-48" x2="0" y2="-2"/>
                <line x1="-17" y1="-47" x2="17" y2="-47"/>
                <path d="M-11 -41 Q0 -37 11 -41 M-12 -34 Q0 -30 12 -34 M-11 -27 Q0 -23 11 -27 M-10 -20 Q0 -16 10 -20" fill="none"/>
                <path d="M-9 -3 Q0 6 9 -3" fill="none"/>
              </g>
              <path id="tunic" fill="#f59b1c"
                d="M-17 -52 C-22 -30 -24 -8 -23 8 L-17 4 L-11 9 L-5 4 L0 9 L5 4 L11 9 L17 4 L23 8 C24 -8 22 -30 17 -52 Q0 -38 -17 -52Z"/>
              <path id="tunicSpots" fill="url(#spots)"
                d="M-17 -52 C-22 -30 -24 -8 -23 8 L-17 4 L-11 9 L-5 4 L0 9 L5 4 L11 9 L17 4 L23 8 C24 -8 22 -30 17 -52 Q0 -38 -17 -52Z"/>

              <!-- head -->
              <g id="head">
                <rect class="skin" x="-5.5" y="-12" width="11" height="14" rx="4"/>
                <ellipse cx="0" cy="-30" rx="21" ry="19" fill="#6a3a1f"/>
                <circle class="skin" cx="-18" cy="-24" r="4"/>
                <circle class="skin" cx="18" cy="-24" r="4"/>
                <ellipse class="skin" cx="0" cy="-25" rx="17" ry="16"/>
                <path fill="#6a3a1f" d="M-19 -26 C-21 -4 -11 8 0 8 C11 8 21 -4 19 -26 C15 -18 9 -17 0 -17 C-9 -17 -15 -18 -19 -26Z"/>
                <path fill="#6a3a1f" d="M-19 -28 C-21 -48 21 -48 19 -28 C14 -36 -14 -36 -19 -28Z"/>
                <path fill="#6a3a1f" d="M-4 -44 C-7 -54 5 -57 7 -48 C3 -48 -1 -43 -4 -44Z"/>
                <circle cx="-12.5" cy="-21.5" r="3.4" fill="#ee6f62" opacity=".5"/>
                <circle cx="12.5" cy="-21.5" r="3.4" fill="#ee6f62" opacity=".5"/>
                <!-- mouth -->
                <ellipse id="mouth" cx="0" cy="-10" rx="4" ry="2.4" fill="#2b130b"/>
                <rect id="teeth" x="-3.5" y="-13.5" width="7" height="2.6" rx="1" fill="#fff" opacity="0"/>
                <path fill="#6a3a1f" d="M-11 -17 C-6 -22 -2 -19 0 -17 C2 -19 6 -22 11 -17 C6 -13 2 -14.5 0 -15 C-2 -14.5 -6 -13 -11 -17Z"/>
                <!-- eyes -->
                <g id="eyeL" transform="translate(-7 -28)">
                  <circle id="scL" r="4.6" fill="#fff" opacity="0"/>
                  <ellipse id="puL" rx="2.3" ry="2.9" fill="#2b1a12"/>
                </g>
                <g id="eyeR" transform="translate(7 -28)">
                  <circle id="scR" r="4.6" fill="#fff" opacity="0"/>
                  <ellipse id="puR" rx="2.3" ry="2.9" fill="#2b1a12"/>
                </g>
                <path id="browL" d="M-12 -35 Q-7.5 -37.5 -3 -35" stroke="#5a2f17" stroke-width="3" stroke-linecap="round" fill="none"/>
                <path id="browR" d="M3 -35 Q7.5 -37.5 12 -35" stroke="#5a2f17" stroke-width="3" stroke-linecap="round" fill="none"/>
                <circle id="gM" cx="0" cy="-10" r="0.1" fill="none"/>
              </g>
              <!-- arm L (screen left) -->
              <g id="armL">
                <rect class="skin" x="-4.2" y="-3" width="8.4" height="25" rx="4.2"/>
                <line class="bone" x1="0" y1="0" x2="0" y2="21"/>
                <g id="foreL">
                  <rect class="skin" x="-3.8" y="-3" width="7.6" height="25" rx="3.8"/>
                  <line class="bone" x1="0" y1="0" x2="0" y2="21"/>
                  <g id="fingL">
                    <rect class="skin" x="-4.5" y="22" width="3" height="9" rx="1.5" transform="rotate(14 -3 22)"/>
                    <rect class="skin" x="1.5" y="22" width="3" height="9" rx="1.5" transform="rotate(-14 3 22)"/>
                  </g>
                  <circle class="skin" cx="0" cy="23" r="5.6"/>
                  <circle id="gL" cx="0" cy="24" r="0.1" fill="none"/>
                </g>
              </g>
              <!-- arm R (screen right) -->
              <g id="armR">
                <rect class="skin" x="-4.2" y="-3" width="8.4" height="25" rx="4.2"/>
                <line class="bone" x1="0" y1="0" x2="0" y2="21"/>
                <g id="foreR">
                  <rect class="skin" x="-3.8" y="-3" width="7.6" height="25" rx="3.8"/>
                  <line class="bone" x1="0" y1="0" x2="0" y2="21"/>
                  <circle class="skin" cx="0" cy="23" r="5.6"/>
                  <circle id="gR" cx="0" cy="24" r="0.1" fill="none"/>
                </g>
              </g>

            </g>
          </g>
        </g>

        <!-- ===== cables ===== -->
        <g id="plugs" fill="#1c1c1e">
          <rect x="181" y="257.5" width="10" height="9" rx="2"/>
          <rect x="172" y="259" width="10" height="2" rx="1"/>
          <rect x="172" y="263" width="10" height="2" rx="1"/>
          <rect x="371" y="257.5" width="10" height="9" rx="2"/>
        </g>
        <path id="cordA" fill="none" stroke="#1c1c1e" stroke-width="3.6" stroke-linecap="round"/>
        <path id="cordB" fill="none" stroke="#1c1c1e" stroke-width="3.6" stroke-linecap="round"/>

        <!-- ===== fx ===== -->
        <g id="fx">
          <circle id="flash" r="120" fill="url(#flashG)" opacity="0"/>
          <g id="bolts" fill="none" stroke="#fff6a8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></g>
          <g id="sparkR" opacity="0" stroke="#ffe45c" stroke-width="2" stroke-linecap="round">
            <path d="M376 250 l0 -10 M376 250 l-8 -7 M376 250 l8 -7"/>
          </g>
        </g>
      </g>
    </svg>

    <h3>Look like you're lost</h3>
    <p>the page you are looking for is not available!</p>
    <a href="index.html" class="link_404">Go to Home</a>
  </div>
</section>

<script>
/* ===== script.js ===== */
(() => {
  const $ = id => document.getElementById(id);
  const svg = $('stage');
  const GROUND = 262, LX = 186, RX = 376, FLOOR = { x: 292, y: GROUND };
  const Z = -0.16;       // timing offset of everything after the zap
  const ZT = 4.66 + Z;   // moment of the zap (4.5 s)
  const T = 9.0 + Z;     // loop length (s)

  /* ---------- helpers ---------- */
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const sm = x => { x = clamp(x); return x * x * (3 - 2 * x); };
  const win = (t, a, b, r = .2) => sm((t - a) / r) * (1 - sm((t - b) / r));
  const hex = h => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16));
  const mix = (a, b, t) => { const A = hex(a), B = hex(b);
    return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',')})`; };

  const E = {
    io:  x => .5 - .5 * Math.cos(Math.PI * x),
    in:  x => x * x,
    out: x => 1 - (1 - x) * (1 - x),
    lin: x => x
  };

  /* ---------- pose defaults ----------
     Angles: 0 = pointing down, +90 = left, 180 = up, -90 = right (absolute, relative to torso). */
  const START = {
    px: 260, py: 214, rot: 0, sx: 1, sy: 1, torso: 0, head: 0, lookX: 0, lookY: 1,
    aL: 20, fL: -110, aR: -20, fR: 110, tL: 3, sL: 0, tR: -3, sR: 0,
    blink: 0, squint: 0, mouth: .05, wide: 0, brow: 0, lift: 0,
    xray: 0, glow: 0, hot: 0, fing: 0,
    Ahl: 1, Ahr: 0, Am: 0, Bhl: 0, Bhr: 1, Bm: 0, tightB: 0,
    alpha: 0, flash: 0
  };

  const STAR = { torso: 0, head: -4, aL: 125, fL: 105, aR: -125, fR: -105, tL: 40, sL: 28, tR: -40, sR: -28,
    xray: 1, glow: 1, wide: 1, mouth: 1, brow: 10, lift: 3, squint: 0, hot: 1, tightB: 1,
    Ahl: 0, Ahr: 0, Am: 0, Bhr: 0, Bm: 1, lookX: 0, lookY: 0, px: 260, py: 214 };

  /* ---------- timeline (seconds) ---------- */
  const K = [
    [0,    START],                                                                   // 1) both hands hold a plug each
    [0.35, { alpha: 1 }],
    [0.75, { lookY: 1.6, head: 3, brow: -2 }],                                         //    look at the plugs
    [0.95, {}],
    [1.4,  { aR: -142, fR: 168, head: -8, torso: -4, px: 258, lookY: -1.2, lookX: 1.2, // 2) right hand lifts its plug...
             brow: 4, lift: 1.5, mouth: .2 }],
    [3.0,  {}],                                                                        //    ...and shakes it (procedural, see render)
    [3.55, { aR: -155, fR: 64, head: 3, torso: 0, px: 260, lookX: 0, lookY: 1.6,       // 3) plug to the mouth
             squint: .3, brow: -4, lift: 1, mouth: .05 }],
    [3.78, { Bhr: 0, Bm: 1 }],                                                         //    sucking (procedural)
    [4.4,  {}],
    [4.66 + Z, STAR],                                                                    // ZAP
    [5.55 + Z, { py: 132, px: 262 }, 'out'],                                             // fly up to the 404
    [6.15 + Z, {}],
    [6.28 + Z, { py: 136, xray: 0, glow: 0, hot: 0, tightB: 0, Bm: 0, wide: .4, mouth: .7,   // go limp
             aL: 55, fL: 20, aR: -55, fR: -20, tL: 18, sL: 5, tR: -18, sR: -5, head: 6, lift: 0, brow: 6 }],
    [6.5 + Z,  { py: 226, aL: 35, fL: -20, aR: -35, fR: 20, tL: 72, sL: -85, tR: -72, sR: 85, // fall & sit
             wide: .2, mouth: .4, head: 2 }],
    [6.72 + Z, { py: 248, sy: .94, wide: 0, mouth: .2, squint: .2, brow: 8, head: 0 }],        // land
    [6.84 + Z, { py: 244, sy: 1.02 }],
    [6.98 + Z, { py: 248, sy: 1 }],
    [7.4 + Z,  { aL: 30, fL: -125, aR: -30, fR: 125, head: 3, mouth: .1, squint: .15 }],       // 5) chin on hands
    [8.5 + Z,  {}],
    [8.9 + Z,  { alpha: 0 }],
    [9.0 + Z,  { ...START, alpha: 0 }, 'lin']
  ];

  const tracks = {};
  let cur = {};
  K.forEach(([t, p, e = 'io']) => {
    cur = { ...cur, ...p };
    for (const k in cur) (tracks[k] ||= []).push([t, cur[k], e]);
  });

  function sample(t) {
    const o = {};
    for (const k in tracks) {
      const a = tracks[k];
      let i = a.length - 1;
      while (i > 0 && a[i][0] > t) i--;
      if (i === a.length - 1 || a[i + 1][0] === a[i][0]) { o[k] = a[i][1]; continue; }
      const n = a[i + 1], u = (t - a[i][0]) / (n[0] - a[i][0]);
      o[k] = a[i][1] + (n[1] - a[i][1]) * E[n[2]](u);
    }
    return o;
  }

  /* ---------- cached nodes ---------- */
  const skins = [...document.querySelectorAll('.skin')];
  const bones = [...document.querySelectorAll('.bone')];
  const ribs = $('ribs');
  ribs.querySelectorAll('line,path').forEach(n => {
    n.setAttribute('stroke', '#fffbe0'); n.setAttribute('stroke-width', '2.2'); n.setAttribute('stroke-linecap', 'round');
  });
  bones.forEach(n => { n.setAttribute('stroke', '#fffbe0'); n.setAttribute('stroke-width', '3'); n.setAttribute('stroke-linecap', 'round'); });

  const el = {};
  ['root','torso','head','armL','armR','foreL','foreR','legL','legR','shinL','shinR','fingL',
   'eyeL','eyeR','puL','puR','scL','scR','browL','browR','mouth','teeth','tunic','tunicSpots',
   'cordA','cordB','actors','char','flash','bolts','sparkR','shadow','glowColor','gL','gR','gM'
  ].forEach(id => el[id] = $(id));

  const pt = svg.createSVGPoint();
  function world(node) {
    pt.x = +node.getAttribute('cx'); pt.y = +node.getAttribute('cy');
    const sp = pt.matrixTransform(node.getScreenCTM());
    return sp.matrixTransform(svg.getScreenCTM().inverse());
  }

  const BLINKS = [0.65, 3.3, 7.7 + Z, 8.2 + Z];
  const blinkAt = t => BLINKS.reduce((m, b) => Math.max(m, 1 - clamp(Math.abs(t - b) / .09)), 0);

  /* ---------- render one frame ---------- */
  function render(t) {
    const s = sample(t);

    /* procedural motion layered on the keyframes */
    const shake = win(t, 1.55, 3.0, .15);          // shaking the plug
    s.fR += 20 * Math.sin(t * 19) * shake;
    s.aR += 5 * Math.sin(t * 19 + 1.3) * shake;
    s.head += 2 * Math.sin(t * 19 + 2.2) * shake;
    s.sway = 9 * Math.sin(t * 19 + 2.8) * shake;   // the cable whips side to side
    s.aL += .8 * Math.sin(t * 2.1);                // left hand idles

        const calm = win(t, 7.3 + Z, 8.6 + Z, .3);
    s.head += 1.3 * Math.sin(t * 2.3) * calm;
    s.sy += .006 * Math.sin(t * 3) * calm;

    const zap = sm((t - ZT) / .05) * (1 - sm((t - ZT - 1.49) / .1));      // 0..1 while being electrocuted
    const jx = zap * (2.2 * Math.sin(t * 83) + 1.2 * Math.sin(t * 131));
    const jy = zap * (1.8 * Math.sin(t * 97 + 1));
    const jr = zap * 3.5 * Math.sin(t * 71);
    s.aL += zap * 7 * Math.sin(t * 61);  s.aR += zap * 7 * Math.sin(t * 67 + 2);
    s.tL += zap * 5 * Math.sin(t * 59);  s.tR += zap * 5 * Math.sin(t * 73 + 1);
    s.fL += zap * 6 * Math.sin(t * 79);  s.fR += zap * 6 * Math.sin(t * 89);
    s.glow *= .8 + .2 * Math.sin(t * 90);

    // sucking on the plug: pursed lips pulsing, hand nudging the plug in/out, eyes on the cable
    const suck = win(t, 3.8, 4.4, .08);
    const pump = Math.sin(t * 17);
    s.mouth = s.mouth * (1 - suck) + suck * (-.15 + .25 * pump);
    s.fR += suck * 5 * pump;
    s.head += suck * 1.2 * Math.sin(t * 17 + 1);
    s.squint = Math.max(s.squint, suck * .4);
    s.lift += suck * .8 * pump;

    // free-fall (gravity) while dropping
    if (t >= ZT + 1.62 && t < ZT + 2.06) { const u = (t - ZT - 1.62) / .44; s.py = 136 + (248 - 136) * u * u; }

    s.blink = Math.max(s.blink, blinkAt(t));

    /* skeleton transforms */
    el.root.setAttribute('transform', `translate(${s.px + jx} ${s.py + jy}) rotate(${s.rot + jr}) scale(${s.sx} ${s.sy})`);
    el.torso.setAttribute('transform', `rotate(${s.torso})`);
    el.head.setAttribute('transform', `translate(0 -50) rotate(${s.head})`);
    el.armL.setAttribute('transform', `translate(-17 -47) rotate(${s.aL})`);
    el.foreL.setAttribute('transform', `translate(0 21) rotate(${s.fL - s.aL})`);
    el.armR.setAttribute('transform', `translate(17 -47) rotate(${s.aR})`);
    el.foreR.setAttribute('transform', `translate(0 21) rotate(${s.fR - s.aR})`);
    el.legL.setAttribute('transform', `translate(-9 0) rotate(${s.tL})`);
    el.shinL.setAttribute('transform', `translate(0 24) rotate(${s.sL - s.tL})`);
    el.legR.setAttribute('transform', `translate(9 0) rotate(${s.tR})`);
    el.shinR.setAttribute('transform', `translate(0 24) rotate(${s.sR - s.tR})`);
    el.fingL.setAttribute('opacity', clamp(s.fing));

    /* face */
    const lid = 1 - Math.max(s.blink * .95, s.squint * .55);
    const ey = Math.max(.06, lid) * (1 + .15 * s.wide);
    ['L', 'R'].forEach(k => {
      el['eye' + k].style.transform = '';
      el['pu' + k].setAttribute('transform', `translate(${s.lookX} ${s.lookY}) scale(1 ${ey})`);
      el['sc' + k].setAttribute('opacity', clamp(s.wide));
      el['sc' + k].setAttribute('transform', `scale(1 ${Math.max(.05, 1 - s.blink)})`);
    });
    el.browL.setAttribute('transform', `translate(0 ${-s.lift}) rotate(${-s.brow} -7.5 -36)`);
    el.browR.setAttribute('transform', `translate(0 ${-s.lift}) rotate(${s.brow} 7.5 -36)`);
    el.mouth.setAttribute('rx', Math.max(2.4, 3.6 + 2 * s.mouth));
    el.mouth.setAttribute('ry', Math.max(1.3, 1.6 + 5 * s.mouth));
    el.teeth.setAttribute('opacity', s.mouth > .6 ? 1 : 0);

    /* x-ray look */
    const x = clamp(s.xray);
    const skin = mix('#f2b48d', '#ffd466', x);
    skins.forEach(n => { n.style.fill = skin; n.style.fillOpacity = 1 - .35 * x; });
    bones.forEach(n => n.setAttribute('opacity', x));
    ribs.setAttribute('opacity', x);
    el.tunic.style.fill = mix('#f59b1c', '#ffc040', x);
    el.tunic.style.fillOpacity = 1 - .72 * x;
    el.tunicSpots.style.opacity = 1 - .8 * x;

    el.char.setAttribute('filter', s.glow > .02 ? 'url(#glow)' : 'none');
    el.glowColor.setAttribute('flood-opacity', clamp(s.glow));

    /* cables */
    const hL = world(el.gL), hR = world(el.gR), mo = world(el.gM);
    const blend = (wl, wr, wm) => {
      let sum = wl + wr + wm; const n = sum > 1 ? sum : 1;
      const f = Math.max(0, 1 - sum / n);
      return { x: (hL.x * wl + hR.x * wr + mo.x * wm) / n + FLOOR.x * f,
               y: (hL.y * wl + hR.y * wr + mo.y * wm) / n + FLOOR.y * f };
    };
    const A = blend(s.Ahl, s.Ahr, s.Am);
    const B = blend(s.Bhl, s.Bhr, s.Bm);
    const cA = { x: A.x, y: GROUND };
    const mid = { x: (RX + B.x) / 2, y: (GROUND + B.y) / 2 };
    const cB = { x: B.x + (mid.x - B.x) * s.tightB + (s.sway || 0), y: GROUND + (mid.y - GROUND) * s.tightB };
    el.cordA.setAttribute('d', `M${LX} ${GROUND} Q${cA.x} ${cA.y} ${A.x} ${A.y}`);
    el.cordB.setAttribute('d', `M${RX} ${GROUND} Q${cB.x} ${cB.y} ${B.x} ${B.y}`);
    el.cordB.setAttribute('stroke', mix('#1c1c1e', '#fff3a8', clamp(s.hot)));
    el.cordB.setAttribute('filter', s.hot > .05 ? 'url(#cordGlow)' : 'none');

    /* fx */
    const cx = s.px + jx, cy = s.py + jy - 38;
    const fl = clamp(1 - (t - ZT) / .35) * (t >= ZT && t < ZT + .45 ? 1 : 0);
    el.flash.setAttribute('cx', cx); el.flash.setAttribute('cy', cy);
    el.flash.setAttribute('opacity', fl);
    el.sparkR.setAttribute('opacity', zap > .5 && Math.sin(t * 90) > -.2 ? 1 : 0);

    if (zap > .5) {
      let seed = Math.floor(t * 24) * 9301 + 49297;
      const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
      let d = '';
      for (let b = 0; b < 6; b++) {
        const a = rnd() * Math.PI * 2; let r = 32 + rnd() * 6;
        d += `<polyline points="${[0, 1, 2, 3].map(i => {
          const aa = a + (rnd() - .5) * .5, rr = r + i * (9 + rnd() * 5);
          return `${(cx + Math.cos(aa) * rr).toFixed(1)},${(cy + Math.sin(aa) * rr).toFixed(1)}`;
        }).join(' ')}"/>`;
      }
      el.bolts.innerHTML = d;
    } else if (el.bolts.firstChild) el.bolts.innerHTML = '';

    const h = Math.max(0, 214 - s.py);
    el.shadow.setAttribute('cx', s.px);
    el.shadow.setAttribute('rx', (s.py > 230 ? 30 : 24) * (1 - clamp(h / 150, 0, .75)));
    el.shadow.setAttribute('opacity', .1 * (1 - clamp(h / 150, 0, .7)) * s.alpha);
    el.actors.setAttribute('opacity', clamp(s.alpha));
  }

  /* ---------- run ---------- */
  window.__render = render;                         // handy for debugging: __render(4.9)
  const frozen = new URLSearchParams(location.search).get('t');
  if (frozen !== null) { render(parseFloat(frozen)); return; }
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { render(8); return; }

  const t0 = performance.now();
  (function loop(now) {
    render(((now - t0) / 1000) % T);
    requestAnimationFrame(loop);
  })(t0);
})();
</script>
</body>
</html>
