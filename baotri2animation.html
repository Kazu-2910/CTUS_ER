<!DOCTYPE html>
<html lang="vi" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="google" content="notranslate">
<title>Đang cập nhật - Sổ Rèn Luyện</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
<script src="sakura.js"></script>
<script src="lang.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #1e293b;
    background: linear-gradient(135deg, #e0e7ff 0%, #f8fafc 45%, #fce7f3 100%);
    background-size: 250% 250%;
    animation: bgShift 12s ease infinite;
    overflow: hidden;
    transition: background 0.3s ease, color 0.3s ease;
  }

  body.dark-mode {
    color: #f8fafc;
    background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
    background-size: 250% 250%;
  }

  @keyframes bgShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* Chớp sáng toàn màn hình khi bị giật điện */
  #zap-flash-overlay {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle, rgba(254, 240, 138, 0.38) 0%, rgba(250, 204, 21, 0) 70%);
    pointer-events: none;
    opacity: 0;
    z-index: 15;
    transition: opacity 0.08s ease;
  }

  .page_404 {
    width: 100%;
    max-width: 560px;
    position: relative;
    z-index: 10;
  }

  /* Khung kính mờ Glassmorphism */
  .contant_box_404 {
    background: rgba(255, 255, 255, 0.68);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255, 255, 255, 0.85);
    border-radius: 28px;
    padding: 28px 24px 32px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(15, 23, 42, 0.1);
    transition: transform 0.06s linear, box-shadow 0.2s ease;
  }

  body.dark-mode .contant_box_404 {
    background: rgba(30, 41, 59, 0.65);
    border-color: rgba(255, 255, 255, 0.12);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
  }

  .contant_box_404.zapping {
    box-shadow: 0 0 40px rgba(250, 204, 21, 0.45), 0 20px 50px rgba(15, 23, 42, 0.2);
  }

  #stage {
    width: 100%;
    height: auto;
    display: block;
    overflow: visible;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  body.dark-mode #scene path,
  body.dark-mode #scene rect,
  body.dark-mode #scene ellipse {
    fill: rgba(148, 163, 184, 0.16);
  }
  body.dark-mode #scene g[fill="#3fb02f"] circle,
  body.dark-mode #scene g[fill="#3fb02f"] ellipse {
    fill: #22c55e;
  }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 5px 14px;
    border-radius: 99px;
    background: rgba(67, 81, 181, 0.12);
    color: #4351b5;
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 6px;
  }
  body.dark-mode .status-pill {
    background: rgba(99, 102, 241, 0.22);
    color: #a5b4fc;
  }
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #f59e0b;
    animation: pulseDot 1.4s infinite;
  }
  @keyframes pulseDot {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.45); opacity: 0.5; }
  }

  .contant_box_404 h3 {
    font-size: 22px;
    font-weight: 800;
    margin-top: 8px;
    letter-spacing: -0.2px;
  }

  .contant_box_404 p {
    font-size: 14px;
    margin-top: 8px;
    color: #64748b;
    line-height: 1.55;
  }
  body.dark-mode .contant_box_404 p { color: #94a3b8; }

  /* Thanh tiến độ chạy mượt */
  .progress-wrap {
    width: 100%;
    max-width: 300px;
    height: 7px;
    background: rgba(148, 163, 184, 0.25);
    border-radius: 99px;
    margin: 18px auto 6px;
    overflow: hidden;
  }
  .progress-bar {
    width: 45%;
    height: 100%;
    border-radius: 99px;
    background: linear-gradient(90deg, #4351b5, #ec4899, #f59e0b, #10b981);
    background-size: 200% 100%;
    animation: progressMove 2.2s ease-in-out infinite;
  }
  @keyframes progressMove {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(240%); }
  }

  .tap-hint {
    font-size: 12px;
    color: #94a3b8;
    margin-bottom: 18px;
  }

  .btn-group {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .link_404 {
    color: #fff !important;
    padding: 12px 24px;
    background: linear-gradient(135deg, #4351b5 0%, #6366f1 100%);
    border-radius: 14px;
    font-size: 14px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    border: none;
    cursor: pointer;
    box-shadow: 0 10px 22px rgba(67, 81, 181, 0.3);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .link_404:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 28px rgba(67, 81, 181, 0.45);
  }

  .btn-zap {
    padding: 12px 18px;
    border-radius: 14px;
    font-size: 14px;
    font-weight: 700;
    background: rgba(245, 158, 11, 0.14);
    color: #d97706;
    border: 1px solid rgba(245, 158, 11, 0.35);
    cursor: pointer;
    transition: all 0.2s ease;
  }
  body.dark-mode .btn-zap {
    background: rgba(250, 204, 21, 0.14);
    color: #fde047;
    border-color: rgba(250, 204, 21, 0.35);
  }
  .btn-zap:hover {
    transform: translateY(-2px);
    background: rgba(245, 158, 11, 0.24);
  }
</style>
</head>

<script>
// Tự động đồng bộ Dark Mode từ Sổ Rèn Luyện
if (localStorage.getItem('srl_theme') === 'dark') {
  document.body.classList.add('dark-mode');
}

(() => {
  const $ = id => document.getElementById(id);
  const svg = $('stage');
  const cardBox = $('card-box');
  const flashOverlay = $('zap-flash-overlay');
  const GROUND = 262, LX = 186, RX = 376, FLOOR = { x: 292, y: GROUND };
  const Z = -0.16;
  const ZT = 4.66 + Z;
  const T = 9.0 + Z;

  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const sm = x => { x = clamp(x); return x * x * (3 - 2 * x); };
  const win = (t, a, b, r = .2) => sm((t - a) / r) * (1 - sm((t - b) / r));
  const hex = h => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16));
  const mix = (a, b, t) => { const A = hex(a), B = hex(b);
    return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',')})`; };

  const E = {
    io:  x => .5 - .5 * Math.cos(Math.PI * x),
    in:  x => x * x,
    out: x => 1 - (1 - x) * (1 - x),
    lin: x => x
  };

  const START = {
    px: 260, py: 214, rot: 0, sx: 1, sy: 1, torso: 0, head: 0, lookX: 0, lookY: 1,

    Ahl: 0, Ahr: 0, Am: 0, Bhr: 0, Bm: 1, lookX: 0, lookY: 0, px: 260, py: 214 };

  const K = [
    [0,    START],
    [0.35, { alpha: 1 }],
    [0.75, { lookY: 1.6, head: 3, brow: -2 }],
    [0.95, {}],
    [1.4,  { aR: -142, fR: 168, head: -8, torso: -4, px: 258, lookY: -1.2, lookX: 1.2,

    [3.0,  {}],
    [3.55, { aR: -155, fR: 64, head: 3, torso: 0, px: 260, lookX: 0, lookY: 1.6,
             squint: .3, brow: -4, lift: 1, mouth: .05 }],
    [3.78, { Bhr: 0, Bm: 1 }],
    [4.4,  {}],
    [4.66 + Z, STAR],
    [5.55 + Z, { py: 132, px: 262 }, 'out'],
    [6.15 + Z, {}],
    [6.28 + Z, { py: 136, xray: 0, glow: 0, hot: 0, tightB: 0, Bm: 0, wide: .4, mouth: .7,
             aL: 55, fL: 20, aR: -55, fR: -20, tL: 18, sL: 5, tR: -18, sR: -5, head: 6, lift: 0, brow: 6 }],
    [6.5 + Z,  { py: 226, aL: 35, fL: -20, aR: -35, fR: 20, tL: 72, sL: -85, tR: -72, sR: 85,
             wide: .2, mouth: .4, head: 2 }],
    [6.72 + Z, { py: 248, sy: .94, wide: 0, mouth: .2, squint: .2, brow: 8, head: 0 }],
    [6.84 + Z, { py: 244, sy: 1.02 }],
    [6.98 + Z, { py: 248, sy: 1 }],
    [7.4 + Z,  { aL: 30, fL: -125, aR: -30, fR: 125, head: 3, mouth: .1, squint: .15 }],
    [8.5 + Z,  {}],
    [8.9 + Z,  { alpha: 0 }],
    [9.0 + Z,  { ...START, alpha: 0 }, 'lin']
  ];

  const tracks = {};
  let cur = {};
  K.forEach(([t, p, e = 'io']) => {
    cur = { ...cur, ...p };
    for (const k in cur) (tracks[k] ||= []).push([t, cur[k], e]);
  });

  function sample(t) {
    const o = {};
    for (const k in tracks) {
      const a = tracks[k];
      let i = a.length - 1;
      while (i > 0 && a[i][0] > t) i--;
      if (i === a.length - 1 || a[i + 1][0] === a[i][0]) { o[k] = a[i][1]; continue; }
      const n = a[i + 1], u = (t - a[i][0]) / (n[0] - a[i][0]);
      o[k] = a[i][1] + (n[1] - a[i][1]) * E[n[2]](u);
    }
    return o;
  }

  const skins = [...document.querySelectorAll('.skin')];
  const bones = [...document.querySelectorAll('.bone')];
  const ribs = $('ribs');
  ribs.querySelectorAll('line,path').forEach(n => {
    n.setAttribute('stroke', '#fffbe0'); n.setAttribute('stroke-width', '2.2'); n.setAttribute('stroke-linecap', 'round');
  });
  bones.forEach(n => { n.setAttribute('stroke', '#fffbe0'); n.setAttribute('stroke-width', '3'); n.setAttribute('stroke-linecap', 'round'); });

  const el = {};
  ['root','torso','head','armL','armR','foreL','foreR','legL','legR','shinL','shinR','fingL',
   'eyeL','eyeR','puL','puR','scL','scR','browL','browR','mouth','teeth','tunic','tunicSpots',
   'cordA','cordB','actors','char','flash','bolts','sparkR','shadow','glowColor','gL','gR','gM'
  ].forEach(id => el[id] = $(id));

  const pt = svg.createSVGPoint();
  function world(node) {
    pt.x = +node.getAttribute('cx'); pt.y = +node.getAttribute('cy');
    const sp = pt.matrixTransform(node.getScreenCTM());
    return sp.matrixTransform(svg.getScreenCTM().inverse());
  }

  const BLINKS = [0.65, 3.3, 7.7 + Z, 8.2 + Z];
  const blinkAt = t => BLINKS.reduce((m, b) => Math.max(m, 1 - clamp(Math.abs(t - b) / .09)), 0);

  function render(t) {
    const s = sample(t);

    const shake = win(t, 1.55, 3.0, .15);
    s.fR += 20 * Math.sin(t * 19) * shake;
    s.aR += 5 * Math.sin(t * 19 + 1.3) * shake;
    s.head += 2 * Math.sin(t * 19 + 2.2) * shake;
    s.sway = 9 * Math.sin(t * 19 + 2.8) * shake;
    s.aL += .8 * Math.sin(t * 2.1);

    const calm = win(t, 7.3 + Z, 8.6 + Z, .3);
    s.head += 1.3 * Math.sin(t * 2.3) * calm;
    s.sy += .006 * Math.sin(t * 3) * calm;

    const zap = sm((t - ZT) / .05) * (1 - sm((t - ZT - 1.49) / .1));
    const jx = zap * (2.2 * Math.sin(t * 83) + 1.2 * Math.sin(t * 131));
    const jy = zap * (1.8 * Math.sin(t * 97 + 1));
    const jr = zap * 3.5 * Math.sin(t * 71);
    s.aL += zap * 7 * Math.sin(t * 61);  s.aR += zap * 7 * Math.sin(t * 67 + 2);
    s.tL += zap * 5 * Math.sin(t * 59);  s.tR += zap * 5 * Math.sin(t * 73 + 1);
    s.fL += zap * 6 * Math.sin(t * 79);  s.fR += zap * 6 * Math.sin(t * 89);
    s.glow *= .8 + .2 * Math.sin(t * 90);

    // Rung khung kính mờ + chớp sáng khi bị điện giật
    if (zap > 0.3) {
      const sx = (Math.sin(t * 95) * 4 * zap).toFixed(1);
      const sy = (Math.cos(t * 110) * 3 * zap).toFixed(1);
      cardBox.style.transform = `translate(${sx}px, ${sy}px)`;
      cardBox.classList.add('zapping');
      flashOverlay.style.opacity = (0.35 + 0.35 * Math.sin(t * 80)) * zap;
    } else {
      cardBox.style.transform = '';
      cardBox.classList.remove('zapping');
      flashOverlay.style.opacity = 0;
    }

    const suck = win(t, 3.8, 4.4, .08);
    const pump = Math.sin(t * 17);
    s.mouth = s.mouth * (1 - suck) + suck * (-.15 + .25 * pump);
    s.fR += suck * 5 * pump;
    s.head += suck * 1.2 * Math.sin(t * 17 + 1);
    s.squint = Math.max(s.squint, suck * .4);
    s.lift += suck * .8 * pump;

    if (t >= ZT + 1.62 && t < ZT + 2.06) { const u = (t - ZT - 1.62) / .44; s.py = 136 + (248 - 136) * u * u; }

    s.blink = Math.max(s.blink, blinkAt(t));

    el.root.setAttribute('transform', `translate(${s.px + jx} ${s.py + jy}) rotate(${s.rot + jr}) scale(${s.sx} ${s.sy})`);
    el.torso.setAttribute('transform', `rotate(${s.torso})`);
    el.head.setAttribute('transform', `translate(0 -50) rotate(${s.head})`);
    el.armL.setAttribute('transform', `translate(-17 -47) rotate(${s.aL})`);
    el.foreL.setAttribute('transform', `translate(0 21) rotate(${s.fL - s.aL})`);
    el.armR.setAttribute('transform', `translate(17 -47) rotate(${s.aR})`);
    el.foreR.setAttribute('transform', `translate(0 21) rotate(${s.fR - s.aR})`);
    el.legL.setAttribute('transform', `translate(-9 0) rotate(${s.tL})`);
    el.shinL.setAttribute('transform', `translate(0 24) rotate(${s.sL - s.tL})`);
    el.legR.setAttribute('transform', `translate(9 0) rotate(${s.tR})`);
    el.shinR.setAttribute('transform', `translate(0 24) rotate(${s.sR - s.tR})`);
    el.fingL.setAttribute('opacity', clamp(s.fing));

    const lid = 1 - Math.max(s.blink * .95, s.squint * .55);
    const ey = Math.max(.06, lid) * (1 + .15 * s.wide);
    ['L', 'R'].forEach(k => {
      el['eye' + k].style.transform = '';
      el['pu' + k].setAttribute('transform', `translate(${s.lookX} ${s.lookY}) scale(1 ${ey})`);
      el['sc' + k].setAttribute('opacity', clamp(s.wide));
      el['sc' + k].setAttribute('transform', `scale(1 ${Math.max(.05, 1 - s.blink)})`);
    });
    el.browL.setAttribute('transform', `translate(0 ${-s.lift}) rotate(${-s.brow} -7.5 -36)`);
    el.browR.setAttribute('transform', `translate(0 ${-s.lift}) rotate(${s.brow} 7.5 -36)`);
    el.mouth.setAttribute('rx', Math.max(2.4, 3.6 + 2 * s.mouth));
    el.mouth.setAttribute('ry', Math.max(1.3, 1.6 + 5 * s.mouth));
    el.teeth.setAttribute('opacity', s.mouth > .6 ? 1 : 0);

    const x = clamp(s.xray);
    const skin = mix('#f2b48d', '#ffd466', x);
    skins.forEach(n => { n.style.fill = skin; n.style.fillOpacity = 1 - .35 * x; });
    bones.forEach(n => n.setAttribute('opacity', x));
    ribs.setAttribute('opacity', x);
    el.tunic.style.fill = mix('#f59b1c', '#ffc040', x);
    el.tunic.style.fillOpacity = 1 - .72 * x;
    el.tunicSpots.style.opacity = 1 - .8 * x;

    el.char.setAttribute('filter', s.glow > .02 ? 'url(#glow)' : 'none');
    el.glowColor.setAttribute('flood-opacity', clamp(s.glow));

    const hL = world(el.gL), hR = world(el.gR), mo = world(el.gM);
    const blend = (wl, wr, wm) => {
      let sum = wl + wr + wm; const n = sum > 1 ? sum : 1;
      const f = Math.max(0, 1 - sum / n);
      return { x: (hL.x * wl + hR.x * wr + mo.x * wm) / n + FLOOR.x * f,
               y: (hL.y * wl + hR.y * wr + mo.y * wm) / n + FLOOR.y * f };
    };
    const A = blend(s.Ahl, s.Ahr, s.Am);
    const B = blend(s.Bhl, s.Bhr, s.Bm);
    const cA = { x: A.x, y: GROUND };
    const mid = { x: (RX + B.x) / 2, y: (GROUND + B.y) / 2 };
    const cB = { x: B.x + (mid.x - B.x) * s.tightB + (s.sway || 0), y: GROUND + (mid.y - GROUND) * s.tightB };
    el.cordA.setAttribute('d', `M${LX} ${GROUND} Q${cA.x} ${cA.y} ${A.x} ${A.y}`);
    el.cordB.setAttribute('d', `M${RX} ${GROUND} Q${cB.x} ${cB.y} ${B.x} ${B.y}`);
    el.cordB.setAttribute('stroke', mix('#1c1c1e', '#fff3a8', clamp(s.hot)));
    el.cordB.setAttribute('filter', s.hot > .05 ? 'url(#cordGlow)' : 'none');

    const cx = s.px + jx, cy = s.py + jy - 38;
    const fl = clamp(1 - (t - ZT) / .35) * (t >= ZT && t < ZT + .45 ? 1 : 0);
    el.flash.setAttribute('cx', cx); el.flash.setAttribute('cy', cy);
    el.flash.setAttribute('opacity', fl);
    el.sparkR.setAttribute('opacity', zap > .5 && Math.sin(t * 90) > -.2 ? 1 : 0);

    if (zap > .5) {
      let seed = Math.floor(t * 24) * 9301 + 49297;
      const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
      let d = '';
      for (let b = 0; b < 6; b++) {
        const a = rnd() * Math.PI * 2; let r = 32 + rnd() * 6;
        d += `<polyline points="${[0, 1, 2, 3].map(i => {
          const aa = a + (rnd() - .5) * .5, rr = r + i * (9 + rnd() * 5);
          return `${(cx + Math.cos(aa) * rr).toFixed(1)},${(cy + Math.sin(aa) * rr).toFixed(1)}`;
        }).join(' ')}"/>`;
      }
      el.bolts.innerHTML = d;
    } else if (el.bolts.firstChild) el.bolts.innerHTML = '';

    const h = Math.max(0, 214 - s.py);
    el.shadow.setAttribute('cx', s.px);
    el.shadow.setAttribute('rx', (s.py > 230 ? 30 : 24) * (1 - clamp(h / 150, 0, .75)));
    el.shadow.setAttribute('opacity', .1 * (1 - clamp(h / 150, 0, .7)) * s.alpha);
    el.actors.setAttribute('opacity', clamp(s.alpha));
  }

  window.__render = render;
  const frozen = new URLSearchParams(location.search).get('t');
  if (frozen !== null) { render(parseFloat(frozen)); return; }
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { render(8); return; }

  let t0 = performance.now();

  // Chạm vào nhân vật hoặc bấm nút "Giật điện ngay" để tua tới đoạn giật điện
  function triggerZapNow() {
    t0 = performance.now() - (ZT * 1000);
  }
  svg.addEventListener('click', triggerZapNow);
  $('btn-trigger-zap').addEventListener('click', triggerZapNow);

  (function loop(now) {
    render(((now - t0) / 1000) % T);
    requestAnimationFrame(loop);
  })(t0);
})();
document.addEventListener('DOMContentLoaded', function () {
  const savedLang = localStorage.getItem('srl_lang') || localStorage.getItem('lang') || 'vi';
  if (typeof setLanguage === 'function') {
    setLanguage(savedLang);
  } else if (typeof applyTranslations === 'function') {
    applyTranslations(savedLang);
  }
});
</script>
</body>
</html>
